# 結構逐字取自教材:README 7.6 / CURRICULUM.md M7.2(Resource Server)
# 與 M7.2(OAuth2 Client)。僅將示例主機 sso.example.com/realms/bank 換成本機
# 實測環境 localhost:8080/realms/demo,client 換成教材第 3 章建立的 web-app。
server:
  port: 8081
spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/demo
          # Spring 自動從 issuer 的 discovery 取得 JWKS 並快取
      client:
        registration:
          keycloak:
            client-id: web-app
            client-secret: ${KC_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            scope: openid,profile
        provider:
          keycloak:
            issuer-uri: http://localhost:8080/realms/demo
